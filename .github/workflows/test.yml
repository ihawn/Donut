name: Unit tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read
jobs:
  lint:
    # Self-hosted runner: never run code from fork PRs on it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    # Self-hosted runner: never run code from fork PRs on it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      matrix:
        python: ['3.10', '3.13']
    runs-on: [self-hosted, linux]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: donut --help

  installer:
    # Self-hosted runner: never run code from fork PRs on it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install using shell bootstrap
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/donut-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/donut-bin
        shell: bash
        run: |
          export DONUT_INSTALL_SOURCE="$(pwd)/$(ls dist/*.whl)"
          sh install.sh
          "$UV_TOOL_BIN_DIR/donut" --help
      - name: Verify reinstall upgrades and preserves configuration
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/donut-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/donut-bin
        run: python scripts/check_installer_upgrade.py
