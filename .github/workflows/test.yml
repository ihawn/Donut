name: Unit tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: donut --help

  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install using shell bootstrap
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/donut-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/donut-bin
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export DONUT_INSTALL_SOURCE="$(pwd)/$(ls dist/*.whl)"
          sh install.sh
          "$UV_TOOL_BIN_DIR/donut" --help
      - name: Install using PowerShell bootstrap
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/donut-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/donut-bin
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DONUT_INSTALL_SOURCE = (Get-ChildItem dist/*.whl).FullName
          ./install.ps1
          & "$env:UV_TOOL_BIN_DIR/donut.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI smoke test failed' }
      - name: Verify reinstall upgrades and preserves configuration
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/donut-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/donut-bin
        run: python scripts/check_installer_upgrade.py
