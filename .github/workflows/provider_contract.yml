name: Provider contract

# The unit tests run against fake agent executables. This job installs the real provider CLIs and
# checks that every flag Donut passes is still one they document, so upstream renames show up here
# instead of in a user's terminal. It never blocks a release.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - donut/providers.py
      - scripts/check_provider_flags.py
      - .github/workflows/provider_contract.yml

permissions:
  contents: read

jobs:
  flags:
    # Self-hosted runner: never run code from fork PRs on it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install provider CLIs
        run: npm install -g @openai/codex @anthropic-ai/claude-code @qwen-code/qwen-code
      - run: python -m pip install .
      - run: python scripts/check_provider_flags.py
