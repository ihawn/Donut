name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  package:
    outputs:
      version: ${{ steps.version.outputs.version }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Select release version
        id: version
        run: |
          version=$(python scripts/release_version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          RELEASE_VERSION="$version" python - <<'PY'
          import os, pathlib, re
          path = pathlib.Path('pyproject.toml')
          text, count = re.subn(r'^version = "[^"\n]+"$', 'version = "' + os.environ['RELEASE_VERSION'] + '"', path.read_text(), count=1, flags=re.M)
          assert count == 1, 'Expected one package version field'
          path.write_text(text)
          PY
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test installed wheel outside source checkout
        run: |
          python -m venv "$RUNNER_TEMP/donut-smoke"
          "$RUNNER_TEMP/donut-smoke/bin/pip" install dist/*.whl
          mkdir "$RUNNER_TEMP/donut-project"
          cd "$RUNNER_TEMP/donut-project"
          "$RUNNER_TEMP/donut-smoke/bin/donut" --help
          "$RUNNER_TEMP/donut-smoke/bin/donut" init
          test -f .donut/skills/swim-lane-worker/SKILL.md
          test -f skills/donut-planner/SKILL.md
          test -f swim_lanes/to_do/.gitkeep
      - name: Create SHA-256 checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: donut-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: donut-distributions
          path: dist/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.package.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --target "$RELEASE_SHA" --generate-notes --title "Donut $RELEASE_TAG"
          fi
