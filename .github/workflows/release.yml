name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag must match pyproject.toml version'
          PY
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test installed wheel outside source checkout
        run: |
          python -m venv "$RUNNER_TEMP/donut-smoke"
          "$RUNNER_TEMP/donut-smoke/bin/pip" install dist/*.whl
          mkdir "$RUNNER_TEMP/donut-project"
          cd "$RUNNER_TEMP/donut-project"
          "$RUNNER_TEMP/donut-smoke/bin/donut" --help
          "$RUNNER_TEMP/donut-smoke/bin/donut" init
          test -f .qwen/skills/swim-lane-worker/SKILL.md
          test -f skills/donut-planner/SKILL.md
          test -f swim_lanes/to_do/.gitkeep
      - name: Create SHA-256 checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: donut-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: donut-distributions
          path: dist/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "Donut $RELEASE_TAG"
          fi
