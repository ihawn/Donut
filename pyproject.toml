[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "donut-cli"
version = "0.3.0"
description = "Fresh-context coding agents, one swim-lane ticket at a time"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual>=8.2,<9", "claude-agent-sdk>=0.2.179,<0.3"]

[project.scripts]
donut = "donut.cli:main"
qwen-build-next = "donut.legacy:main"

[tool.setuptools.package-data]
donut = ["skills/*/SKILL.md"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E731"]
